# PR-Agent (https://github.com/The-PR-Agent/pr-agent): AI review and code suggestions on every
# pull request, drafts included. BLA 237. When the review fails (scored runs only), a second pass
# reruns it on DeepSeek V4.1 Flash with reasoning off.
# This file is identical in every repo. The review rules live in the private repo
# blazeluminati/pr-agent-settings (pr_agent.toml and scorecard.py), read at main on every run.
# Copy this file to .github/workflows/pr-agent.yml unchanged; edit the rules there, not here.
name: PR-Agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
permissions: {}
jobs:
  pr_agent:
    name: pr-agent
    # Same-repository PRs only (fork PRs get no secrets). On comments, only the exact commands
    # /review and /improve (no arguments; a trailing space or newline is allowed) and "/ask <question>"
    # with no "--" anywhere (PR-Agent options), on a PR, from owners, members and collaborators.
    # /describe and arguments are not allowed.
    # Never a bot (no feedback loops).
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (contains(fromJSON('["/review","/review ","/review\n","/review\r\n","/review\t"]'), github.event.comment.body) ||
         contains(fromJSON('["/improve","/improve ","/improve\n","/improve\r\n","/improve\t"]'), github.event.comment.body) ||
         ((startsWith(github.event.comment.body, '/ask ') || startsWith(github.event.comment.body, fromJSON('"/ask\n"')) || startsWith(github.event.comment.body, fromJSON('"/ask\r"')) || startsWith(github.event.comment.body, fromJSON('"/ask\t"'))) && !contains(fromJSON('["/ask ","/ask\n","/ask\r\n","/ask\t"]'), github.event.comment.body) && !contains(github.event.comment.body, '--'))) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    # The action is a Docker image. The Studio Linux VM runners have Docker, but their runner
    # accounts are not in the docker group, so this runs on GitHub-hosted Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Job-level, so a comment the filter rejects (job skipped) never joins a group. Pushes and an
    # exact /review share the PR's review group, so a new push cancels the older review; /ask and
    # /improve use their own group, so they can't cancel a running review.
    concurrency:
      group: ${{ format('pr-agent-{0}-{1}', github.event.pull_request.number || github.event.issue.number, (github.event_name == 'pull_request' || contains(fromJSON('["/review","/review ","/review\n","/review\r\n","/review\t"]'), github.event.comment.body)) && 'review' || 'cmd') }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check for the secrets and capture the PR head
        id: gate
        env:
          HAS_KEY: ${{ secrets.OPENROUTER_KEY != '' }}
          HAS_SETTINGS_KEY: ${{ secrets.PR_AGENT_SETTINGS_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_SETTINGS_KEY" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PR-Agent skipped::Set the OPENROUTER_KEY and PR_AGENT_SETTINGS_KEY secrets (Settings > Secrets and variables > Actions) for PR-Agent to run."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          # The review must be updated after this moment to count as a review of this run.
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Score only pull_request events and an exact /review comment, against the head
          # captured here, before PR-Agent runs. /improve and /ask never touch the scorecard.
          if [ "$EVENT" = "pull_request" ]; then
            echo "score=true" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s' "$COMMENT" | tr -d '[:space:]')" = "/review" ]; then
            echo "score=true" >> "$GITHUB_OUTPUT"
            echo "head=$(gh api "repos/$REPO/pulls/$ISSUE_NUMBER" --jq .head.sha)" >> "$GITHUB_OUTPUT"
          else
            echo "score=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the shared review rules
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: blazeluminati/pr-agent-settings
          # Every repo follows main, so one merge there updates them all.
          ref: main
          path: .pr-agent-shared
          ssh-key: ${{ secrets.PR_AGENT_SETTINGS_KEY }}
          persist-credentials: false
      - name: PR-Agent
        id: pragent
        if: steps.gate.outputs.ready == 'true'
        # A failed first pass doesn't end the job: the check below decides on a second pass, and
        # the last step fails the job if no review was scored. About three sequential model calls
        # (review, suggestions, their self-review), each under the shared ai_timeout of 240 s;
        # the cap leaves the second pass and the scorecard inside the job's 25 minutes.
        continue-on-error: true
        timeout-minutes: 14
        # Image pinned by digest; the action wrapper only adds a FROM on the rolling
        # :github_action tag, so pinning its commit would not pin what runs.
        # Digest attestation verified with: gh attestation verify --repo The-PR-Agent/pr-agent
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe # v0.50.0-github_action (action commit e673a02076ce09a4726c3d0c3cc85780e59ca52b)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          # Log as it happens, so a slow model call shows in the job log.
          PYTHONUNBUFFERED: "1"
          # All review rules: model, limits, triggers, instructions. The repo's own
          # .pr_agent.toml (default branch) is applied after this and can override it.
          config.extra_config_url: /github/workspace/.pr-agent-shared/pr_agent.toml
          # On scored runs a failure here starts the second pass, so post no "Failed to ..."
          # comment for it. /improve and /ask keep theirs; a failed second pass still posts.
          PR_REVIEWER__PUBLISH_REVIEW_FAILURE_COMMENT: ${{ steps.gate.outputs.score == 'true' && 'false' || 'true' }}
          PR_CODE_SUGGESTIONS__PUBLISH_FAILURE_COMMENT: ${{ steps.gate.outputs.score == 'true' && 'false' || 'true' }}
      - name: Check the first review
        id: check
        # Decides the second pass. The scorecard's own verdict, printed and not posted (DRY_RUN),
        # is asked whether this run left a fresh, scorable review of the head, as if the step had
        # succeeded. No such review (a 400, a 429, a timeout, an empty or unparseable answer, no
        # update for this head): rerun everything (mode=full). A good review but a failed step:
        # only the code suggestions failed, so rerun just those and keep the review
        # (mode=improve). A review clipped for the token budget counts as present, since a
        # rerun can't fix that; the scorecard still marks it failed.
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.score == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          STEP_OUTCOME: ${{ steps.pragent.outcome }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
          RUN_STARTED: ${{ steps.gate.outputs.started }}
          DRY_RUN: "1"
        run: |
          mode=none
          reason=""
          if [ ! -f .pr-agent-shared/scorecard.py ]; then
            echo "The shared settings were not fetched; no second pass."
          elif verdict=$(REVIEW_OUTCOME=success python3 -I .pr-agent-shared/scorecard.py); then
            printf '%s\n' "$verdict" | sed -n 2p
            fresh=true
            if printf '%s\n' "$verdict" | sed -n 2p | grep -q 'status=failed'; then
              reason=$(printf '%s\n' "$verdict" | sed -n 's/^\*\*⛔ Not scored on [0-9a-f]*\.\*\* \(.*\) This PR is not scored as clean\.$/\1/p')
              case "$reason" in
                "PR too large for a full review"*) echo "The review was clipped for the token budget; a rerun can't fix that." ;;
                *) fresh=false ;;
              esac
            fi
            if [ "$fresh" = "false" ]; then
              mode=full
              if [ "$STEP_OUTCOME" != "success" ]; then
                reason="The PR-Agent review failed; see the workflow run."
              fi
            elif [ "$STEP_OUTCOME" != "success" ]; then
              mode=improve
              reason="The code suggestions failed; the review is kept."
            fi
          elif [ "$STEP_OUTCOME" != "success" ]; then
            # The verdict couldn't be read and the step failed: rerun everything.
            mode=full
            reason="The PR-Agent review failed; see the workflow run."
          else
            echo "The verdict couldn't be read and the first pass succeeded; no second pass."
          fi
          if [ "$mode" = "full" ]; then
            echo "::warning title=PR-Agent second pass::The first review failed (${reason:-no reason given}); rerunning the review and code suggestions on DeepSeek."
          elif [ "$mode" = "improve" ]; then
            echo "::warning title=PR-Agent second pass::$reason Rerunning only the code suggestions on DeepSeek."
          fi
          # What the second pass runs. In full mode, the shared settings' own values.
          if [ "$mode" = "improve" ]; then
            auto_review=false
            push_commands='["/improve"]'
          else
            auto_review=$(python3 -I -c 'import tomllib; d = tomllib.load(open(".pr-agent-shared/pr_agent.toml", "rb")).get("github_action_config", {}); print(str(d.get("auto_review", True)).lower())' 2>/dev/null || echo true)
            push_commands=$(python3 -I -c 'import json, tomllib; d = tomllib.load(open(".pr-agent-shared/pr_agent.toml", "rb")).get("github_action_config", {}); print(json.dumps(d.get("push_commands", ["/review", "/improve"])))' 2>/dev/null || echo '["/review", "/improve"]')
          fi
          {
            echo "mode=$mode"
            echo "reason=$(printf '%s' "$reason" | tr -d '\r\n')"
            echo "auto_review=$auto_review"
            echo "push_commands=$push_commands"
          } >> "$GITHUB_OUTPUT"
      - name: PR-Agent second pass (DeepSeek, reasoning off)
        id: second
        if: ${{ !cancelled() && (steps.check.outputs.mode == 'full' || steps.check.outputs.mode == 'improve') }}
        timeout-minutes: 6
        # Same image and key. Env beats the shared settings file (PR-Agent re-applies env after
        # each file), so only the model, reasoning and (in improve mode) the tools change; every
        # review rule stays the same.
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe # v0.50.0-github_action (action commit e673a02076ce09a4726c3d0c3cc85780e59ca52b)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          PYTHONUNBUFFERED: "1"
          config.extra_config_url: /github/workspace/.pr-agent-shared/pr_agent.toml
          # DeepSeek V4.1 Flash with reasoning off, as before Flint: it answers in 5-20 seconds.
          # With reasoning on it spends its whole output cap reasoning and answers nothing.
          CONFIG__MODEL: openrouter/deepseek/deepseek-v4.1-flash-1017
          CONFIG__FALLBACK_MODELS: "[]"
          OPENROUTER__REASONING_EFFORT: none
          OPENROUTER__MAX_TOKENS: "32000"
          # Which tools run: everything in full mode, only /improve in improve mode (opened and
          # reopened PRs use auto_review/auto_improve, pushes use push_commands).
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: ${{ steps.check.outputs.auto_review }}
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: ${{ steps.check.outputs.push_commands }}
      - name: Scorecard
        id: scorecard
        # Runs when PR-Agent or the settings fetch fails too, so a failed review replaces the old
        # scorecard with key_issues=-1 instead of leaving an earlier verdict in place. After a
        # second pass it scores the review left standing and says which pass wrote it.
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.score == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # full: the second pass's outcome. improve: the review was already checked as fresh and
          # scorable, so only the suggestions were rerun. Otherwise the first pass's outcome.
          REVIEW_OUTCOME: ${{ steps.check.outputs.mode == 'full' && steps.second.outcome || steps.check.outputs.mode == 'improve' && 'success' || steps.pragent.outcome }}
          REVIEW_PASS: ${{ steps.check.outputs.mode == 'full' && 'second' || steps.check.outputs.mode == 'improve' && 'improve' || 'first' }}
          FIRST_PASS_REASON: ${{ steps.check.outputs.reason }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
          RUN_STARTED: ${{ steps.gate.outputs.started }}
        run: |
          if [ -f .pr-agent-shared/scorecard.py ]; then
            verdict=$(python3 -I .pr-agent-shared/scorecard.py)
            printf '%s\n' "$verdict"
            # scorecard.py prints the hidden line it posted last.
            if printf '%s\n' "$verdict" | tail -n 1 | grep -q 'status=failed'; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
            else
              echo "status=scored" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # The shared settings could not be fetched: post a failed scorecard, and fail the step.
          python3 -I - <<'PY'
          import json, os, subprocess
          def gh(*args, data=None):
              return subprocess.run(["gh", "api", *args], input=data, capture_output=True, text=True, check=True).stdout
          repo, pr = os.environ["REPO"], os.environ["PR_NUMBER"]
          head = os.environ.get("HEAD_SHA") or json.loads(gh(f"repos/{repo}/pulls/{pr}"))["head"]["sha"]
          pages = json.loads(gh("--paginate", "--slurp", f"repos/{repo}/issues/{pr}/comments"))
          mine = [c for page in pages for c in page
                  if c["user"]["login"] == "github-actions[bot]" and c["body"].startswith("<!-- pr-agent:scorecard -->")]
          body = ("<!-- pr-agent:scorecard -->\n"
                  f"<!-- key_issues=-1 overall=0 status=failed head={head} -->\n"
                  "## PR-Agent scorecard\n\n"
                  f"**⛔ Not scored on {head[:7]}.** The shared settings couldn't be loaded from "
                  "blazeluminati/pr-agent-settings, so this PR is not scored as clean.\n")
          payload = json.dumps({"body": body})
          if mine:
              gh("-X", "PATCH", f"repos/{repo}/issues/comments/{mine[0]['id']}", "--input", "-", data=payload)
          else:
              gh("-X", "POST", f"repos/{repo}/issues/{pr}/comments", "--input", "-", data=payload)
          PY
          exit 1
      - name: Fail when no review was scored
        # The first pass may fail without failing the job (continue-on-error). The job goes red
        # when, after both passes, the scorecard has no scorable review of the head
        # (status=failed, key_issues=-1), or when no PR-Agent pass succeeded (this also covers
        # /improve and /ask, which have no scorecard).
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' && (steps.scorecard.outputs.status == 'failed' || (steps.pragent.outcome == 'failure' && steps.second.outcome != 'success')) }}
        env:
          SCORECARD: ${{ steps.scorecard.outputs.status }}
        run: |
          if [ "$SCORECARD" = "failed" ]; then
            echo "::error title=PR-Agent not scored::No scorable PR-Agent review of this head (scorecard key_issues=-1); see the scorecard comment."
          else
            echo "::error title=PR-Agent failed::No PR-Agent pass succeeded; see the steps above."
          fi
          exit 1
