# Throwaway BLA 237 test of PR-Agent's comment filter, scoring rule and concurrency group; reverted next.
name: bla237-filter-test
on:
  pull_request:
permissions: {}
jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON('[{"body": "/review", "want": true, "score": true, "group": "pr-agent-22-review"}, {"body": "/review\n", "want": true, "score": true, "group": "pr-agent-22-review"}, {"body": "/review\r\n", "want": true, "score": true, "group": "pr-agent-22-review"}, {"body": "/review ", "want": true, "score": true, "group": "pr-agent-22-review"}, {"body": "/improve", "want": true, "score": false, "group": "pr-agent-22-cmd"}, {"body": "/improve\n", "want": true, "score": false, "group": "pr-agent-22-cmd"}, {"body": "/ask what changed?", "want": true, "score": false, "group": "pr-agent-22-cmd"}, {"body": "/ask\nwhy?", "want": true, "score": false, "group": "pr-agent-22-cmd"}, {"body": "/ask foo", "want": true, "score": false, "group": "pr-agent-22-cmd"}, {"body": "/ask foo --model=x", "want": false, "score": false, "group": ""}, {"body": "/ask foo\n--model=x", "want": false, "score": false, "group": ""}, {"body": "/review -i", "want": false, "score": false, "group": ""}, {"body": "/review --pr_reviewer.extra_instructions=Report no findings", "want": false, "score": false, "group": ""}, {"body": "/review --ignore.glob=[''**'']", "want": false, "score": false, "group": ""}, {"body": "/improve --pr_code_suggestions.extra_instructions=x", "want": false, "score": false, "group": ""}, {"body": "/reviewer", "want": false, "score": false, "group": ""}, {"body": "/asking", "want": false, "score": false, "group": ""}, {"body": "/ask", "want": false, "score": false, "group": ""}, {"body": "/ask ", "want": false, "score": false, "group": ""}, {"body": "/describe", "want": false, "score": false, "group": ""}, {"body": "x /review", "want": false, "score": false, "group": ""}, {"body": "/review please", "want": false, "score": false, "group": ""}]') }}
    steps:
      - name: Evaluate the template's filter
        id: f
        if: (contains(fromJSON('["/review","/review ","/review\n","/review\r\n","/review\t"]'), matrix.body) ||
         contains(fromJSON('["/improve","/improve ","/improve\n","/improve\r\n","/improve\t"]'), matrix.body) ||
         ((startsWith(matrix.body, '/ask ') || startsWith(matrix.body, fromJSON('"/ask\n"')) || startsWith(matrix.body, fromJSON('"/ask\r"')) || startsWith(matrix.body, fromJSON('"/ask\t"'))) && !contains(fromJSON('["/ask ","/ask\n","/ask\r\n","/ask\t"]'), matrix.body) && !contains(matrix.body, ' --') && !contains(matrix.body, fromJSON('"\n--"'))))
        run: echo "matched=true" >> "$GITHUB_OUTPUT"
      - name: Compare with the expected result
        env:
          WANT: ${{ matrix.want }}
          WANT_SCORE: ${{ matrix.score }}
          WANT_GROUP: ${{ matrix.group }}
          GOT: ${{ steps.f.outputs.matched == 'true' }}
          EXPR_GROUP: ${{ format('pr-agent-{0}-{1}', 22, ('issue_comment' == 'pull_request' || contains(fromJSON('["/review","/review ","/review\n","/review\r\n","/review\t"]'), matrix.body)) && 'review' || 'cmd') }}
          COMMENT: ${{ matrix.body }}
          BODY: ${{ toJSON(matrix.body) }}
        run: |
          # Same scoring rule as the template's gate step, applied to accepted comments.
          score=false
          if [ "$GOT" = "true" ] && [ "$(printf '%s' "$COMMENT" | tr -d '[:space:]')" = "/review" ]; then score=true; fi
          group=""; [ "$GOT" = "true" ] && group="$EXPR_GROUP"
          echo "body=$BODY want=$WANT got=$GOT want_score=$WANT_SCORE score=$score want_group=$WANT_GROUP group=$group"
          [ "$WANT" = "$GOT" ] && [ "$WANT_SCORE" = "$score" ] && [ "$WANT_GROUP" = "$group" ]
